name: Build LineageOS 17.1 for pettyl - setupwork

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar ROM con setupwork.sh
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Purgar paquetes innecesarios manualmente
        run: |
          echo "=== LIMPIEZA DEL SISTEMA ==="

          sudo apt-get clean

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /etc/mysql
          sudo rm -rf /etc/php
          sudo rm -rf /etc/apt/sources.list.d/*

          sudo docker system prune -af || true

          echo
          echo "=== ESPACIO DISPONIBLE ==="
          df -h

      - name: Preparar y ejecutar setupwork.sh
        run: |
          echo "============================================"
          echo " PREPARANDO SETUPWORK"
          echo "============================================"

          chmod +x ./setupwork.sh

          echo
          echo "Ubicación:"
          pwd

          echo
          echo "Contenido del repositorio:"
          ls -lah

          echo
          echo "Ejecutando setupwork.sh..."
          echo

          export TERM=xterm
          export DEBIAN_FRONTEND=noninteractive

          ./setupwork.sh

      - name: Rescatar Logs e Imágenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-Rescatados-Pettyl
          retention-days: 5
          if-no-files-found: warn
          path: |
            /home/runner/android/lineage/build_log.txt
            /home/runner/android/lineage/out/target/product/pettyl/*.img
            /home/runner/android/lineage/out/target/product/pettyl/*.zip

      - name: Diagnóstico si la compilación falla
        if: failure()
        run: |
          echo "============================================"
          echo " DIAGNÓSTICO DE FALLA"
          echo "============================================"

          echo
          echo "=== ESPACIO EN DISCO ==="
          df -h

          echo
          echo "=== MEMORIA ==="
          free -h || true

          echo
          echo "=== BUILD LOG ==="

          if [ -f /home/runner/android/lineage/build_log.txt ]; then
            echo "Últimas 200 líneas:"
            tail -n 200 /home/runner/android/lineage/build_log.txt
          else
            echo "No se encontró build_log.txt."
          fi

          echo
          echo "=== CONTENIDO DE /tmp ==="
          ls -lah /tmp || true

      - name: Crear Issue si la compilación falla
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generando reporte de error..."

          if [ -f /home/runner/android/lineage/build_log.txt ]; then
            tail -n 200 \
              /home/runner/android/lineage/build_log.txt \
              > error_snippet.txt
          else
            echo "No se encontró el archivo build_log.txt." \
              > error_snippet.txt
            echo "Revisa los logs de GitHub Actions." \
              >> error_snippet.txt
          fi

          cat > issue_body.md << 'EOF'
          ## 🚨 La compilación de LineageOS ha fallado

          La ejecución del workflow no pudo terminar la ROM.

          Los artefactos de esta ejecución contienen los archivos
          disponibles de diagnóstico y compilación.

          ### Últimas 200 líneas del log

          ```text
          EOF

          cat error_snippet.txt >> issue_body.md

          cat >> issue_body.md << 'EOF'
          ```

          ### Información

          Workflow ejecutado mediante `workflow_dispatch`.
          EOF

          FECHA=$(date +'%Y-%m-%d %H:%M:%S')

          gh issue create \
            --title "🚨 Build Failed: Revisar logs ($FECHA)" \
            --body-file issue_body.md
