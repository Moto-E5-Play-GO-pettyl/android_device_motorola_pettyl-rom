# Version: 10 (Sin contraseña)
# Changelog:
# - Se eliminó el "Anti-Rojo" para dejar que GitHub muestre los errores reales.
# - Se añadió un registro de logs (build_log.txt).
# - Se configuró la subida de artefactos para que rescate imágenes y logs INCLUSO SI FALLA.
# - Se reemplazó la creación de Release por la generación automática de un Issue si la build falla.
# - Se integró el envío de Live Logs a Render en segundo plano (rápido y sin tokens).

name: Build LineageOS 17.1 for pettyl - logs

on:
  workflow_dispatch:

env:
  # Variable global para los Live Logs
  WEBHOOK_URL: "https://render-gci-terminalonline.onrender.com/auth/terminalonly"

jobs:
  build:
    name: Compilar ROM
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del repositorio actual
        uses: actions/checkout@v4

      - name: Limpieza BRUTAL de espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Purgar paquetes innecesarios manualmente
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo docker system prune -af

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          # Nota: Se agregó 'jq' para formatear los logs de forma segura
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick jq lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Instalar repo
        run: |
          mkdir -p /home/runner/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > /home/runner/bin/repo
          chmod a+x /home/runner/bin/repo
          sudo cp /home/runner/bin/repo /usr/local/bin/repo

      - name: Configurar Git
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Sincronizar LineageOS (Con Live Logs en segundo plano)
        run: |
          mkdir -p /home/runner/android/lineage
          cd /home/runner/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --depth=1
          
          # Creamos un log temporal para la sincronización
          touch sync_log.txt
          
          # Enviamos los logs a Render en segundo plano
          tail -f sync_log.txt | while IFS= read -r line; do
            PAYLOAD=$(jq -n --arg log "$line" '{log: $log}')
            curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ env.WEBHOOK_URL }}/${{ github.run_id }}" > /dev/null || true
          done &
          TAIL_PID=$!
          
          # Ejecutamos el sync y guardamos la salida en el log
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --quiet 2>&1 | tee -a sync_log.txt
          
          # Matamos el proceso en segundo plano al terminar
          kill $TAIL_PID || true

      - name: Clonar y organizar repositorios de pettyl y vendor
        run: |
          cd /home/runner/android/lineage
          git clone https://github.com/Moto-E5-Play-GO-pettyl/android_device_motorola_pettyl-rom -b lineage-17.1 /tmp/pettyl_unified
          mkdir -p device/motorola/pettyl
          mkdir -p vendor/motorola/pettyl
          cp -r /tmp/pettyl_unified/pettyl/* device/motorola/pettyl/
          cp -r /tmp/pettyl_unified/vendor_pettyl/* vendor/motorola/pettyl/
          rm -rf /tmp/pettyl_unified

      - name: TRUCO Eliminar repo oculto para liberar espacio vital
        run: |
          echo "Eliminando la carpeta .repo para recuperar espacio..."
          rm -rf /home/runner/android/lineage/.repo
          df -h

      - name: Restaurar Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-pettyl-${{ github.sha }}
          restore-keys: ccache-pettyl-

      - name: Compilar LineageOS (Con Live Logs Rápido)
        run: |
          cd /home/runner/android/lineage
          export USE_CCACHE=1
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          ccache -o compression=true
          ccache -z
          source build/envsetup.sh
          lunch lineage_pettyl-userdebug
          
          touch build_log.txt
          
          # Iniciamos el envío de logs a Render en segundo plano para NO ralentizar la build
          tail -f build_log.txt | while IFS= read -r line; do
            PAYLOAD=$(jq -n --arg log "$line" '{log: $log}')
            curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ env.WEBHOOK_URL }}/${{ github.run_id }}" > /dev/null || true
          done &
          TAIL_PID=$!
          
          # Compilamos y mandamos todo al log. 'tee' ya lo muestra en la consola de GitHub automáticamente.
          mka bacon -j16 2>&1 | tee -a build_log.txt
          
          echo "=== CCACHE STATS ==="
          ccache -s
          
          # Detenemos el envío de logs
          kill $TAIL_PID || true

      - name: Rescatar Logs e Imágenes (Se ejecuta aunque falle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archivos-Rescatados-Pettyl
          path: |
            /home/runner/android/lineage/build_log.txt
            /home/runner/android/lineage/out/target/product/pettyl/*.img
            /home/runner/android/lineage/out/target/product/pettyl/*.zip
          retention-days: 5

      - name: Crear Issue si la compilación falla
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generando reporte de error..."
          
          tail -n 200 /home/runner/android/lineage/build_log.txt > error_snippet.txt
          
          cat << 'EOF' > issue_body.md
          ## 🚨 La compilación de LineageOS ha fallado
          
          La ejecución del workflow no pudo terminar la ROM. Revisa los artefactos subidos para descargar el archivo `build_log.txt` completo.
          
          ### Últimas 200 líneas del log:
          ```text
          EOF
          
          cat error_snippet.txt >> issue_body.md
          echo '```' >> issue_body.md
          
          FECHA=$(date +'%Y-%m-%d %H:%M')
          
          gh issue create \
            --title "🚨 Build Failed: Revisar logs ($FECHA)" \
            --body-file issue_body.md
